<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <form action="" method="post">
        <label for="name">Imię: </label>
        <input type="text">
        <br>
        <label for="favColor">Ulubiony kolor: </label>
        <input list="colors">
        <datalist id="colors">
            <option value="red">Czerwony</option>
            <option value="blue">Niebieski</option>
            <option value="green">Zielony</option>
            <option value="yellow">Żółty</option>
            <option value="pink">Różowy</option>
            <option value="orange">Pomarańczowy</option>
            <option value="purple">Fioletowy</option>
            <option value="black">Czarny</option>
            <option value="white">Biały</option>
            <option value="grey" hidden>Szary</option>
        </datalist>
        <input type="button" value="Zapisz">
    </form>
    <br><br><br>
    <form action="" method="post">
        <label for="value">Wartość: </label>
        <input type="range" name="value">
        <br>
        <input type="button" value="Wyślij">
        <br><br>
        <label for="actuallyProgress">Aktualny postęp: </label>
        <input type="range" name="actuallyProgress">
        <br>
        <label for="fullProgress">Całkowity postęp: </label>
        <input type="range" name="fullProgress">
        <br>
        <input type="button" value="Wyślij">
        <br><br>
        <label for="fullName">Imię i nazwisko</label>
        <input type="text">
        <br><br>
        <input type="button" value="Wyślij">

    </form>
</body>

</html>
